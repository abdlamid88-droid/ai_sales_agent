# Nginx Configuration for Auto Parts Sales Agent on GCP
# Serves Port 80 HTTP Proxy to Uvicorn at 127.0.0.1:8005 for autoparts-ai.duckdns.org

server {
    listen 80;
    listen [::]:80;
    server_name autoparts-ai.duckdns.org;

    # Allow Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy Headers for FastAPI / Uvicorn
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Reverse Proxy Location to FastAPI Uvicorn on Port 8005
    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
