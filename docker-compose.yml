services:
  web:
    build: .
    container_name: ai_sales_agent_web
    ports:
      - "8002:8000"
    volumes:
      - ./app:/code/app
    env_file:
      - .env
    restart: always
    depends_on:
      - db
      - qdrant

  db:
    image: ankane/pgvector:latest  # PostgreSQL with pgvector extension
    container_name: ai_sales_agent_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: sales_knowledge
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest  # Qdrant Vector Search Engine
    container_name: ai_sales_agent_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  pgdata:
  qdrant_storage:
